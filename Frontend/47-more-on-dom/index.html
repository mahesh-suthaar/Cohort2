<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User cards</title>

    <style>
        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
        }
        html,body{
        height:100%;
        width:100%;
        }
        main{
            height: auto;
            width:100%;
            background-color: black;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap:15px;
            overflow:auto;
        }


        #card{
            border-radius: 15px;
            height: 300px;
            width:200px;
            background-color: rgb(18, 18, 18);
            display: flex;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            cursor:pointer;
            border: 1px solid rgb(117, 116, 116);
        }
        #profile{
            height: 150px;
            width: 150px;
            border-radius: 50%;
            overflow: hidden;
            border:1px solid rgb(82, 129, 248);
        }
         #profile img{
            height: 100%;
            width:100%;
            object-fit: cover;

         }
         #name{
            margin-top: 8px;
            font-size: 18px;
            color: beige;
         }
         #profession{
            color: rgb(82, 129, 248);
            font-size: 14px;
            font-weight: 500;
         }
         #description{
            color:beige;
            margin-top: 10px;
            text-align: center;
         }
    </style>
</head>
<body>
    <main></main>

    <script>
        let main=document.querySelector('main');
        let sum=''        
        const profiles = [
            {
            profileImage: "https://randomuser.me/api/portraits/men/32.jpg",
            username: "jake_dev",
            profession: "Frontend Developer",
            description: "Building sleek, responsive UIs with React and a love for clean code."
             },
             {
               profileImage: "https://randomuser.me/api/portraits/women/44.jpg",

               description: "Crafting intuitive user experiences one wireframe at a time."
             },
             {
               profileImage: "https://randomuser.me/api/portraits/men/15.jpg",

             },
             {

             {

             }
];
    
    profiles.forEach((elem)=>{
        let name=elem.username
        .toLowerCase()
        .split("_")
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(" ");

        sum= sum+`    <div id="card">
        <div id="profile">
            <img src="${elem.profileImage}" alt="">
        </div>
        <h2 id="name">${name}</h2>
        <h4 id="profession">${elem.profession}</h4>
        <p id="description">${elem.description}</p>
    </div>`
    
        
    })
    function renderData(){
       main.innerHTML=sum
    }
    renderData()
    </script>
</body>
</html>
