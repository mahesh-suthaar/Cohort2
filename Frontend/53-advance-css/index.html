<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Effect</title>
    <style>
        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        }
        html,body{
        height:100%;
        width:100%;
        background-color: black;
        }
        body{
            display:flex;
            align-items: center;
            justify-content: center;
        }

        @property --rotate {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
        }

        @keyframes borderAnimate {
        from {
        --rotate: 0deg;
        }

        to {
        --rotate: 360deg;
        }
        }

        
        #box{
            border-radius: 10px;
            height: 400px;
            width: 300px;
            box-sizing: content-box;
            padding: 20px;
            color: white;
            text-align: left;
            background:linear-gradient(black) padding-box, 
            conic-gradient(from var(--rotate),black, black, rgb(255, 1, 225),black, black) border-box;
            border: 0px solid transparent;

            transition: all ease-in-out .3s;
            animation: borderAnimate 5s infinite ;
            animation-timing-function: linear;
            animation-play-state: paused;
            border-width: 0px;

        }
        #inner{
            height: 70%;
            width: 90%;
            margin: auto;
            margin-bottom: 10px;
            border-radius: 10px;
            background-color: rgb(200, 192, 200);
        }

        #box:hover{
            animation-play-state: running;
            border-width: 5px;
            text-shadow: 0 0 20px rgb(255, 0, 234);
            box-shadow: 0 0 20px 5px rgb(251, 1, 222);
            color: rgb(251, 0, 239)
        }
    </style>
</head>
<body>
    <div id="box">
        <div id="inner"></div>
        <h1>The Cult</h1>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Libero, maiores.</p>
    </div>
</body>
</html>
