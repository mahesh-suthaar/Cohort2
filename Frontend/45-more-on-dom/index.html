<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download task</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        html,body{
            height: 100%;
            width:100%;
            background-color: black;
            display: flex;
        }
        main{
            width:50%;
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            margin:auto;
        }
        #outer{
            width: 100%;
            height: 10px;
            background-color: rgb(140, 140, 140);
            border-radius: 50px;

        }
        #inner{
            width: 0%;
            height: 100%;
            background-color: rgb(0, 147, 0);
            border-radius: 50px;
        }
        #container{
            display:flex;
            justify-content: space-between;
            margin-top: 20px;
            width: 100%;
        }
        button{
            padding: 5px 10px;
            background-color: green;
            color:white;
            font-weight: 600;
            border:none;
            border-radius: 5px;
            cursor:pointer;
        }
        button:active{
            scale:1.01;
        }
        p{
            text-align: center;
            margin-bottom: 10px;
        }
        span{
            color:rgb(39, 107, 254);
        }
    </style>
</head>
<body>
    <main>
        <p>Click the button below to download <span>vid.mp4</span> file</p>
        <div id="outer">
            <div id="inner"></div>
        </div>
        <div id="container">
            <h2>0%</h2>
            <button>Download</button>
        </div>
    </main>

    <script>
        let grow=0;
        let btn=document.querySelector('button')
        let inner=document.querySelector('#inner')
        let outer=document.querySelector('#outer')
        h2=document.querySelector('h2')
        btn.addEventListener('click',()=>{
            btn.style.pointerEvents='none'
            btn.style.opacity='70%'

            let num=Math.floor(Math.random()*50+10)
            console.log(`Your file will be downloaded in ${((num*100)/1000)} seconds`)
            let id=setInterval(() => {
                grow++
                if(grow===100){
                clearInterval(id)
                btn.textContent='Downloaded'

                }
                inner.style.width=grow+'%'
                h2.textContent=grow+'%'
            }, num);

        })
    </script>
</body>
</html>
