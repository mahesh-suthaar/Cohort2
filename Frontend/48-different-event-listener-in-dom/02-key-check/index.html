<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>key check</title>
    <style>
        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        }
        html,body{
        height:100%;
        width:100%;
        }
        body{
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1{
            padding:5px;
            border-radius: 5px;
            background-color:rgb(49, 49, 49);
            color:white;
        }
    </style>
</head>
<body>
    <h1>****</h1>

    <script>
        body=document.body
        let h1=document.querySelector('h1')
        body.addEventListener('keydown',(dets)=>{
            
            h1.innerHTML=dets.code
        })
    </script>
</body>
</html>
